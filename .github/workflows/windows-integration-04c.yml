# Private Windows x64 test build for INTEGRATION-04C.
# Trigger: push to the 04C branch only. windows-integration-03.yml stays
# limited to its own branch. workflow_dispatch is intentionally absent.
# pull_request and pull_request_target are intentionally absent.
# The job token is contents: read. No repository secrets are read.
# No GitHub Release is published and electron-builder is invoked with
# --publish never. The checkout must contain INTEGRATION-04B 8b3abf9.

name: Windows integration 04C test installer

on:
  push:
    branches:
      - cursor/phase-integration-04c-windows-ai-connection-393f

permissions:
  contents: read

jobs:
  windows-test-installer:
    name: Windows x64 NSIS test build
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 30

      - name: Verify INTEGRATION-04B source
        shell: pwsh
        run: |
          git merge-base --is-ancestor 8b3abf94ff4a69ae84b7d06707af2e3fcef8d003 HEAD
          if ($LASTEXITCODE -ne 0) { throw "This checkout is not a descendant of INTEGRATION-04B 8b3abf94." }
          if (-not (Select-String -Path src/server/desktopLoopback.ts -Pattern '127\.0\.0\.1' -Quiet)) {
            throw "The INTEGRATION-04B loopback guard is not in this checkout."
          }
          Write-Host "BUILD_SOURCE_SHA=$(git rev-parse HEAD)"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit --pretty false -p tsconfig.json

      - name: Build Next.js standalone server
        run: npm run build

      - name: Compile and stage the desktop app
        run: npm run desktop:pack:prepare

      - name: Scan staged resources
        run: node scripts/scan-desktop-package.mjs desktop-resources/standalone windows-installer-artifacts/staged-scan.json

      - name: Verify staged standalone dependencies
        run: node scripts/verify-packaged-standalone.mjs desktop-resources/standalone windows-installer-artifacts/staged-runtime.json

      - name: Desktop Jest tests
        run: npx jest __tests__/unit/desktop __tests__/unit/server/desktopLoopback.test.ts __tests__/unit/runtime/analysisServiceAvailability.test.ts __tests__/unit/server/practiceInferenceNotice.test.ts __tests__/unit/server/inferenceUpstream.test.ts __tests__/integration/api/inference-upstream.desktop.test.ts __tests__/integration/api/inference-gateway.contract.test.ts --runInBand --forceExit

      - name: Build the unsigned NSIS installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Scan the unpacked app
        run: node scripts/scan-desktop-package.mjs desktop-dist/win-unpacked windows-installer-artifacts/unpacked-scan.json

      - name: Verify unpacked standalone dependencies
        run: node scripts/verify-packaged-standalone.mjs desktop-dist/win-unpacked/resources/standalone windows-installer-artifacts/unpacked-runtime.json --boot

      - name: Write checksum and build metadata
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path windows-installer-artifacts | Out-Null
          $installer = Get-ChildItem desktop-dist -Filter "ChordMini-Setup-*-x64.exe" | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer was not produced." }
          $hash = Get-FileHash -Algorithm SHA256 $installer.FullName
          "$($hash.Hash.ToLower())  $($installer.Name)" | Set-Content -NoNewline windows-installer-artifacts/SHA256SUMS.txt
          Add-Content windows-installer-artifacts/SHA256SUMS.txt ""
          $pythonInUnpacked = $null -ne (Get-ChildItem desktop-dist/win-unpacked -Recurse -Directory -Filter python_backend -ErrorAction SilentlyContinue | Select-Object -First 1)
          @{
            name = "ChordMini"
            version = (Get-Content package.json | ConvertFrom-Json).version
            filename = $installer.Name
            bytes = $installer.Length
            sha256 = $hash.Hash.ToLower()
            arch = "x64"
            target = "nsis"
            signed = $false
            autoUpdate = $false
            nodeRuntime = "electron-run-as-node"
            pythonBundled = [bool]$pythonInUnpacked
            commit = "${{ github.sha }}"
            evaluationBuild = $true
            commercialRelease = $false
          } | ConvertTo-Json | Set-Content windows-installer-artifacts/build-metadata.json

      - name: List and extract the NSIS payload with 7-Zip
        shell: pwsh
        run: |
          $sevenZip = @(
            "$env:ProgramFiles\7-Zip\7z.exe",
            "${env:ProgramFiles(x86)}\7-Zip\7z.exe"
          ) | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          if (-not $sevenZip) { throw "7-Zip is not available, so the NSIS payload was not listed." }
          $installer = Get-ChildItem desktop-dist -Filter "ChordMini-Setup-*-x64.exe" | Select-Object -First 1
          New-Item -ItemType Directory -Force -Path nsis-outer, nsis-payload, windows-installer-artifacts | Out-Null
          & $sevenZip l $installer.FullName | Set-Content -Encoding utf8 windows-installer-artifacts/nsis-listing.txt
          if ($LASTEXITCODE -gt 1) { throw "7-Zip could not list the NSIS installer (exit $LASTEXITCODE)." }
          & $sevenZip x $installer.FullName "-onsis-outer" -y
          if ($LASTEXITCODE -gt 1) { throw "7-Zip could not extract the NSIS installer (exit $LASTEXITCODE)." }
          $inner = Get-ChildItem nsis-outer -Recurse -File -Filter "app-64.7z" | Select-Object -First 1
          if (-not $inner) { throw "NSIS listing did not contain app-64.7z." }
          & $sevenZip x $inner.FullName "-onsis-payload" -y
          if ($LASTEXITCODE -gt 1) { throw "7-Zip could not extract app-64.7z (exit $LASTEXITCODE)." }
          Get-ChildItem nsis-payload -Recurse -File -Filter "ChordMini-Setup-*-x64.exe" | Remove-Item -Force
          $asar = Get-ChildItem nsis-payload -Recurse -File -Filter "app.asar" | Select-Object -First 1
          $app = Get-ChildItem nsis-payload -Recurse -File -Filter "ChordMini.exe" | Select-Object -First 1
          if (-not $asar -or -not $app) {
            throw "7-Zip extraction of app-64.7z did not contain both app.asar and ChordMini.exe."
          }
          @{
            tool = "7-Zip"
            toolPath = $sevenZip
            listed = $true
            extracted = $true
            innerArchive = "app-64.7z"
            appAsarFound = $true
            chordMiniExeFound = $true
          } | ConvertTo-Json | Set-Content windows-installer-artifacts/nsis-inspection.json

      - name: Scan the extracted NSIS payload
        run: node scripts/scan-desktop-package.mjs nsis-payload windows-installer-artifacts/nsis-payload-scan.json

      - name: Install and launch the packaged app
        timeout-minutes: 25
        run: node scripts/windows-packaged-acceptance.mjs

      - name: Write non-sensitive acceptance summary
        if: always()
        run: node scripts/write-integration-03-summary.mjs windows-installer-artifacts "${{ github.sha }}"

      - name: Upload the test installer
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ChordMini-Windows-x64-Integration04C
          path: |
            desktop-dist/ChordMini-Setup-*-x64.exe
            windows-installer-artifacts/SHA256SUMS.txt
            windows-installer-artifacts/acceptance-summary.json
          retention-days: 14
          if-no-files-found: error

      - name: Upload non-sensitive failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ChordMini-Windows-x64-Integration04C-diagnostics
          path: |
            windows-installer-artifacts/staged-scan.json
            windows-installer-artifacts/unpacked-scan.json
            windows-installer-artifacts/nsis-inspection.json
            windows-installer-artifacts/nsis-payload-scan.json
            windows-installer-artifacts/nsis-listing.txt
            windows-installer-artifacts/acceptance-summary.json
            windows-installer-artifacts/build-metadata.json
            windows-installer-artifacts/SHA256SUMS.txt
          retention-days: 14
          if-no-files-found: warn
